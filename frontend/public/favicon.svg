<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Fundo branco para contraste em qualquer aba/tema -->
  <rect width="100" height="100" rx="18" fill="#ffffff"/>
  <!-- Alça esquerda -->
  <path d="M35 42 C35 28 65 28 65 42" stroke="#111111" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Corpo da sacola -->
  <path d="M18 42 H82 L76 84 H24 Z" stroke="#111111" stroke-width="7" stroke-linejoin="round" fill="none"/>
  <!-- Alça esquerda (parte vertical dentro da sacola) -->
  <line x1="35" y1="42" x2="35" y2="54" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
  <!-- Alça direita (parte vertical dentro da sacola) -->
  <line x1="65" y1="42" x2="65" y2="54" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
</svg>
